<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Excel / CSV to Markdown Table Generator (Instant & Free)</title>
    <meta name="description" content="Paste spreadsheets or comma-separated values to instantly generate clean Markdown tables.">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 p-6 min-h-screen">
    <div class="max-w-4xl mx-auto bg-white p-6 rounded-xl shadow-sm border border-gray-200">
        <h1 class="text-2xl font-bold text-gray-900 mb-2">📊 CSV / Tabular Data to Markdown Table</h1>
        <p class="text-sm text-gray-500 mb-4">Paste rows directly from Excel, Google Sheets, or CSV.</p>
        
        <textarea id="rawInput" rows="5" placeholder="Name	Price	Category&#10;Widget	$9.99	Tools&#10;Gadget	$19.99	Hardware" class="w-full p-3 font-mono text-xs border rounded-lg focus:ring-2 focus:ring-indigo-500 mb-4"></textarea>
        
        <label class="block font-bold text-gray-700 mb-1 text-xs">Generated Markdown:</label>
        <textarea id="mdOutput" readonly rows="6" class="w-full p-3 font-mono text-xs bg-gray-900 text-indigo-300 rounded-lg mb-2"></textarea>
        <button onclick="navigator.clipboard.writeText(document.getElementById('mdOutput').value); alert('Copied to clipboard!')" class="text-xs bg-indigo-600 text-white px-4 py-2 rounded font-semibold hover:bg-indigo-700">📋 Copy Markdown</button>
    </div>
    <script>
        document.getElementById('rawInput').addEventListener('input', (e) => {
            const lines = e.target.value.trim().split('\n').map(l => l.split(/\t|,/));
            if (lines.length > 0 && lines[0].length > 0) {
                const header = '| ' + lines[0].join(' | ') + ' |';
                const separator = '| ' + lines[0].map(() => '---').join(' | ') + ' |';
                const body = lines.slice(1).map(r => '| ' + r.join(' | ') + ' |').join('\n');
                document.getElementById('mdOutput').value = [header, separator, body].join('\n');
            }
        });
    </script>
</body>
</html>
