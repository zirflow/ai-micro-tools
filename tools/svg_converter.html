<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SVG to CSS Data URI & Optimizer (Free)</title>
    <meta name="description" content="Convert raw SVG code directly into CSS background-image Data URI. Fast, zero upload.">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 p-6 min-h-screen">
    <div class="max-w-4xl mx-auto bg-white p-6 rounded-xl shadow-sm border border-gray-200">
        <div class="flex items-center justify-between mb-4">
            <h1 class="text-2xl font-bold text-gray-900">🎨 SVG to CSS Data URI Converter</h1>
            <a href="../index.html" class="text-xs text-indigo-600 hover:underline">← Back to Tools</a>
        </div>
        <p class="text-sm text-gray-500 mb-4">Paste raw SVG code to get clean, minified CSS-ready Data URI.</p>

        <textarea id="svgInput" rows="5" placeholder="<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='...' /></svg>" class="w-full p-3 font-mono text-xs border rounded-lg focus:ring-2 focus:ring-indigo-500 mb-4"></textarea>

        <label class="block font-bold text-gray-700 text-xs mb-1">CSS Background Image Snippet:</label>
        <textarea id="cssOutput" readonly rows="3" class="w-full p-3 font-mono text-xs bg-gray-900 text-indigo-300 rounded-lg mb-2"></textarea>
        <button onclick="navigator.clipboard.writeText(document.getElementById('cssOutput').value); alert('Copied to clipboard!')" class="text-xs bg-indigo-600 text-white px-4 py-2 rounded font-semibold hover:bg-indigo-700">📋 Copy CSS Snippet</button>
    </div>
    <script>
        document.getElementById('svgInput').addEventListener('input', (e) => {
            const raw = e.target.value.trim();
            if (raw.startsWith('<svg')) {
                const cleaned = raw.replace(/\s+/g, ' ').replace(/"/g, "'");
                const uri = 'data:image/svg+xml;utf8,' + encodeURIComponent(cleaned);
                document.getElementById('cssOutput').value = `background-image: url("${uri}");`;
            }
        });
    </script>
</body>
</html>
