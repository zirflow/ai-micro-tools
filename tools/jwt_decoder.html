<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Instant JWT Debugger & Security Inspector (Free)</title>
    <meta name="description" content="Fast, client-side JWT token decoder and security checker. Inspect headers, payload, expiration locally without leaking secrets.">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 p-6 min-h-screen">
    <div class="max-w-4xl mx-auto bg-white p-6 rounded-xl shadow-sm border border-gray-200">
        <h1 class="text-2xl font-bold text-gray-900 mb-2">⚡ Instant JWT Decoder & Inspector</h1>
        <p class="text-sm text-gray-500 mb-4">100% Client-side. Your tokens never leave your browser.</p>
        
        <textarea id="jwtInput" rows="4" placeholder="Paste your Bearer eyJhbGciOi..." class="w-full p-3 font-mono text-xs border rounded-lg focus:ring-2 focus:ring-blue-500 mb-4"></textarea>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 font-mono text-xs">
            <div>
                <label class="block font-bold text-gray-700 mb-1">Header:</label>
                <pre id="headerOutput" class="bg-gray-900 text-pink-400 p-3 rounded-lg overflow-x-auto min-h-[120px]">{}</pre>
            </div>
            <div>
                <label class="block font-bold text-gray-700 mb-1">Payload:</label>
                <pre id="payloadOutput" class="bg-gray-900 text-emerald-400 p-3 rounded-lg overflow-x-auto min-h-[120px]">{}</pre>
            </div>
        </div>
        <div id="status" class="mt-4 text-xs font-semibold"></div>
    </div>
    <script>
        document.getElementById('jwtInput').addEventListener('input', (e) => {
            const token = e.target.value.trim().replace(/^Bearer\s+/, '');
            const parts = token.split('.');
            const statusEl = document.getElementById('status');
            if (parts.length === 3) {
                try {
                    const header = JSON.parse(atob(parts[0]));
                    const payload = JSON.parse(atob(parts[1]));
                    document.getElementById('headerOutput').textContent = JSON.stringify(header, null, 2);
                    document.getElementById('payloadOutput').textContent = JSON.stringify(payload, null, 2);
                    statusEl.innerHTML = '<span class="text-emerald-600">✓ Valid JWT Format Parsed Locally</span>';
                } catch(err) {
                    statusEl.innerHTML = '<span class="text-rose-500">✗ Invalid Base64 Encoding</span>';
                }
            } else {
                statusEl.innerHTML = '<span class="text-amber-500">Waiting for 3-part token (header.payload.signature)...</span>';
            }
        });
    </script>
</body>
</html>
